<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed | Advanced Automations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .failed-container {
      background: white;
      border-radius: 24px;
      padding: 3rem;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .failed-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 1rem;
    }

    .message {
      font-size: 1.1rem;
      color: #4a5568;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .message strong {
      color: #2d3748;
      font-weight: 600;
    }

    .help-text {
      background: #fff5f5;
      border-left: 4px solid #f5576c;
      padding: 1rem;
      margin-bottom: 2rem;
      text-align: left;
      border-radius: 8px;
    }

    .help-text p {
      font-size: 0.95rem;
      color: #4a5568;
      margin-bottom: 0.5rem;
    }

    .help-text p:last-child {
      margin-bottom: 0;
    }

    .cta-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
    }

    .btn-secondary {
      background: #f7fafc;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 2rem 0;
    }

    .footer-text {
      font-size: 0.875rem;
      color: #a0aec0;
    }

    @media (max-width: 640px) {
      .failed-container {
        padding: 2rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="failed-container">
    <div class="failed-icon">😕</div>
    <h1>Payment Failed</h1>
    <p class="message">
      <strong>Something went wrong with your payment.</strong> Don't worry — you can try again or contact us for help.
    </p>
    <div class="help-text">
      <p><strong>Common reasons:</strong></p>
      <p>• Insufficient funds or card declined</p>
      <p>• Incorrect billing information</p>
      <p>• Bank security hold</p>
    </div>
    <div class="cta-buttons">
      <a href="payment.html" class="btn btn-primary">Try Again</a>
      <a href="mailto:info@advancedautomations.net" class="btn btn-secondary">Contact Support</a>
    </div>
    <div class="divider"></div>
    <p class="footer-text">Need help? We're here for you</p>
  </div>
</body>
</html>
