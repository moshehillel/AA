<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful | Advanced Automations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .success-container {
      background: white;
      border-radius: 24px;
      padding: 3rem;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ai-image {
      width: 200px;
      height: 200px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #667eea;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    .check-animation {
      width: 200px;
      height: 120px;
      margin: 0 auto 2rem;
      position: relative;
    }

    .check-document {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .check-lines {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
    }

    .check-line {
      height: 8px;
      background: #dee2e6;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .check-line.short {
      width: 40%;
    }

    .check-line.medium {
      width: 60%;
    }

    .check-line.long {
      width: 80%;
    }

    .check-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      color: #16a34a;
      opacity: 0;
      animation: printCheck 2.5s ease-in-out infinite;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(22, 163, 74, 0.4);
    }

    @keyframes printCheck {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0) rotate(-10deg);
      }
      50% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(0.5) rotate(-5deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1) rotate(2deg);
      }
      85% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .message {
      font-size: 1.1rem;
      color: #4a5568;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .message strong {
      color: #2d3748;
      font-weight: 600;
    }

    .cta-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary {
      background: #f7fafc;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 2rem 0;
    }

    .footer-text {
      font-size: 0.875rem;
      color: #a0aec0;
    }

    @media (max-width: 640px) {
      .success-container {
        padding: 2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .ai-image {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="success-container">
    <img src="Images/jerry-robot-signature.png" alt="AI Assistant" class="ai-image">
    <div class="check-animation">
      <div class="check-document">
        <div class="check-lines">
          <div class="check-line short"></div>
          <div class="check-line medium"></div>
          <div class="check-line long"></div>
          <div class="check-line medium"></div>
        </div>
        <div class="check-mark">✓</div>
      </div>
    </div>
    <h1>Payment Successful!</h1>
    <p class="message">
      <strong>You're all set — your AI-powered experience is now unlocked.</strong> Start exploring smarter, faster, and more powerful tools today.
    </p>
    <div class="cta-buttons">
      <a href="index.html" class="btn btn-primary">Return to Home</a>
      <a href="mailto:info@advancedautomations.net" class="btn btn-secondary">Contact Support</a>
    </div>
    <div class="divider"></div>
    <p class="footer-text">Thank you for choosing Advanced Automations</p>
  </div>
</body>
</html>
